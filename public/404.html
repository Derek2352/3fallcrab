<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost crab · 3 Fall Fun</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@700;800&family=Noto+Sans+HK:wght@400;700&display=swap">
<style>
  :root{--set:#FFD23F;--ink:#2E2838;--ink-2:#5B516C;--cream:#FFF4E2;--pink:#DF1B72;--pink-d:#A8155A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--set);color:var(--ink);
    font:16px/1.55 "Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif}
  .card{max-width:420px;width:100%;background:var(--cream);border-radius:28px;padding:28px 24px 26px;text-align:center;
    box-shadow:inset 3px 3px 2px rgba(255,255,255,.7),inset -4px -6px 10px rgba(120,62,12,.14),6px 9px 0 rgba(120,62,12,.24)}
  img{width:120px;height:120px;border-radius:26px;display:block;margin:0 auto 10px}
  h1{font:800 40px/1.05 Gluten,"Arial Rounded MT Bold",sans-serif;margin:0 0 6px;letter-spacing:.5px}
  p{margin:0 0 18px;color:var(--ink-2)}
  a{display:inline-block;background:var(--pink);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;
    box-shadow:inset 2px 2px 1px rgba(255,255,255,.45),inset -2px -4px 6px rgba(0,0,0,.18),3px 4px 0 var(--pink-d)}
  a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="" width="120" height="120">
    <h1>Lost crab!</h1>
    <p>This page fell into the harbour. <span lang="zh-HK">呢頁跌咗落海。</span></p>
    <a href="/">Back to the game <span lang="zh-HK">返回遊戲</span></a>
  </main>
</body>
</html>
